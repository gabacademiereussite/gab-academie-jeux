<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Histoire CM1</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#eef7ff,#fffaf0);color:#17324d}
.wrap{max-width:900px;margin:auto;padding:16px}
.hero{background:#0b3d6e;color:white;padding:24px;border-radius:22px;text-align:center}
.hero h1{margin:0;font-size:42px}.hero p{font-size:18px}
.panel{background:white;margin-top:18px;padding:22px;border-radius:20px;box-shadow:0 7px 20px #0001;border:3px solid #dcecff}
.hidden{display:none}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer{padding:15px;border:3px solid #d5e4f2;background:#f8fbff;border-radius:14px;font-size:18px;font-weight:bold;cursor:pointer;text-align:left}
.answer.correct{background:#eaf9ef;border-color:#18864b}.answer.wrong{background:#fff0f0;border-color:#d94a4a}
.progress{height:13px;background:#e7edf3;border-radius:999px;overflow:hidden;margin:14px 0 20px}.bar{height:100%;width:0;background:#18864b;transition:.3s}
.feedback{display:none;margin-top:18px;padding:15px;border-radius:14px}.feedback.ok{display:block;background:#eaf9ef;border-left:7px solid #18864b}.feedback.no{display:block;background:#fff0f0;border-left:7px solid #d94a4a}
button.main{border:0;border-radius:13px;padding:13px 20px;background:#1e6bb8;color:white;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.intro,.result{text-align:center}.question{font-size:28px;font-weight:bold;line-height:1.25;margin:14px 0}.theme{font-weight:bold;color:#7a4fb3}
.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}.footer{text-align:right;color:#18864b;font-weight:bold;padding:18px 4px}
@media(max-width:650px){.answers{grid-template-columns:1fr}.hero h1{font-size:32px}.question{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<h1>🏰 Mission Histoire CM1</h1>
<p>Du Moyen Âge à la Révolution française</p>
</section>

<section id="intro" class="panel intro">
<h2>Prêt pour la mission ?</h2>
<p>12 questions simples, une correction immédiate et un score final.</p>
<button class="main" onclick="startGame()">Commencer</button>
</section>

<section id="game" class="panel hidden">
<div class="top"><span id="counter" class="theme"></span><strong id="score">Score : 0</strong></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="theme" class="theme"></div>
<div id="question" class="question"></div>
<div id="answers" class="answers"></div>
<div id="feedback" class="feedback"></div>
<button id="next" class="main hidden" onclick="nextQuestion()">Question suivante</button>
</section>

<section id="result" class="panel result hidden">
<div id="medal" style="font-size:64px">🏆</div>
<h2>Mission terminée !</h2>
<p id="finalText" style="font-size:20px"></p>
<button class="main" onclick="restartGame()">Rejouer</button>
</section>

<div class="footer">Gab Académie Réussite</div>
</div>

<script>
const questions=[
{t:"Le Moyen Âge",q:"Où vit généralement le seigneur ?",a:["Dans un château","Dans une usine","Dans une gare","Dans un gratte-ciel"],c:0,e:"Le château est un lieu de vie, de protection et un symbole du pouvoir du seigneur."},
{t:"Le Moyen Âge",q:"Qui travaille principalement la terre ?",a:["Les paysans","Les navigateurs","Les députés","Les imprimeurs"],c:0,e:"Les paysannes et les paysans cultivent les terres de la seigneurie."},
{t:"Le Moyen Âge",q:"Quel grand bâtiment religieux trouve-t-on dans les villes médiévales ?",a:["Une cathédrale","Un aéroport","Un cinéma","Un stade"],c:0,e:"Les cathédrales montrent la place importante de l’Église au Moyen Âge."},
{t:"Les rois de France",q:"Quel roi est lié à la Renaissance et à Léonard de Vinci ?",a:["François Ier","Louis XVI","Napoléon Ier","Clovis"],c:0,e:"François Ier accueille Léonard de Vinci en France."},
{t:"Les rois de France",q:"Quel roi fait de Versailles un symbole de son pouvoir ?",a:["Louis XIV","Henri IV","François Ier","Charlemagne"],c:0,e:"Versailles devient le symbole du pouvoir absolu de Louis XIV."},
{t:"Les rois de France",q:"Sous l’Ancien Régime, la société est divisée en combien d’ordres ?",a:["Trois","Deux","Cinq","Dix"],c:0,e:"Les trois ordres sont le clergé, la noblesse et le tiers état."},
{t:"Les explorations",q:"Quel instrument aide les navigateurs à s’orienter ?",a:["La boussole","La loupe","Le thermomètre","Le sablier"],c:0,e:"La boussole aide les navigateurs à trouver leur direction."},
{t:"Les explorations",q:"En quelle année Christophe Colomb arrive-t-il en Amérique ?",a:["1492","1789","1515","1914"],c:0,e:"1492 est un grand repère des explorations européennes."},
{t:"Les explorations",q:"Quel navire est utilisé lors des grandes explorations ?",a:["La caravelle","Le train","Le sous-marin","La montgolfière"],c:0,e:"La caravelle est adaptée aux voyages lointains."},
{t:"La Révolution française",q:"Quel événement a lieu le 14 juillet 1789 ?",a:["La prise de la Bastille","Le sacre de Louis XIV","Le voyage de Colomb","La construction de Versailles"],c:0,e:"La prise de la Bastille devient un symbole de la Révolution française."},
{t:"La Révolution française",q:"Que supprime la nuit du 4 août 1789 ?",a:["Les privilèges","Les écoles","Les villes","Les marchés"],c:0,e:"La nuit du 4 août marque l’abolition des privilèges."},
{t:"La Révolution française",q:"Quel texte affirme la liberté et l’égalité en 1789 ?",a:["La Déclaration des droits de l’homme et du citoyen","L’édit de Nantes","Le Code noir","La Chanson de Roland"],c:0,e:"La Déclaration des droits de l’homme et du citoyen énonce de nouveaux droits."}
];
let index=0,score=0,locked=false;
function startGame(){intro.classList.add("hidden");game.classList.remove("hidden");showQuestion()}
function showQuestion(){
locked=false;const item=questions[index];
counter.textContent=`Question ${index+1} sur ${questions.length}`;scoreEl.textContent=`Score : ${score}`;
bar.style.width=`${index/questions.length*100}%`;theme.textContent=`📚 ${item.t}`;question.textContent=item.q;
answers.innerHTML="";
item.a.forEach((txt,i)=>{const b=document.createElement("button");b.className="answer";b.textContent=txt;b.onclick=()=>choose(i,b);answers.appendChild(b)});
feedback.className="feedback";feedback.textContent="";next.classList.add("hidden")
}
function choose(choice,button){
if(locked)return;locked=true;const item=questions[index];const btn=[...document.querySelectorAll(".answer")];
btn[item.c].classList.add("correct");
if(choice===item.c){score++;button.classList.add("correct");feedback.className="feedback ok";feedback.innerHTML="<strong>Bravo !</strong> "+item.e}
else{button.classList.add("wrong");feedback.className="feedback no";feedback.innerHTML="<strong>Ce n’est pas la bonne réponse.</strong> "+item.e}
scoreEl.textContent=`Score : ${score}`;bar.style.width=`${(index+1)/questions.length*100}%`;next.textContent=index===questions.length-1?"Voir mon résultat":"Question suivante";next.classList.remove("hidden")
}
function nextQuestion(){index++;if(index<questions.length)showQuestion();else finish()}
function finish(){game.classList.add("hidden");result.classList.remove("hidden");let txt="",med="🏆";
if(score===12){txt=`Excellent ! ${score}/12.`;med="👑"}else if(score>=9){txt=`Très bien ! ${score}/12.`}else if(score>=6){txt=`Bien joué ! ${score}/12.`;med="⭐"}else{txt=`Tu obtiens ${score}/12. Relis les leçons puis rejoue.`;med="📚"}
medal.textContent=med;finalText.textContent=txt}
function restartGame(){index=0;score=0;result.classList.add("hidden");game.classList.remove("hidden");showQuestion()}
const intro=document.getElementById("intro"),game=document.getElementById("game"),result=document.getElementById("result"),counter=document.getElementById("counter"),scoreEl=document.getElementById("score"),bar=document.getElementById("bar"),theme=document.getElementById("theme"),question=document.getElementById("question"),answers=document.getElementById("answers"),feedback=document.getElementById("feedback"),next=document.getElementById("next"),medal=document.getElementById("medal"),finalText=document.getElementById("finalText");
</script>
</body>
</html>
